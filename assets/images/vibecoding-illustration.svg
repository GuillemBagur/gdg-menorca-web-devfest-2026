<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" fill="none">
  <!-- Subtle background card with Google rounded corners -->
  <rect width="540" height="320" rx="24" fill="#F8F9FA"/>
  
  <!-- Subtle architectural sketch lines of Plaça Bit -->
  <path d="M0 240 L540 240" stroke="#E0E0E0" stroke-width="2"/>
  <rect x="40" y="50" width="120" height="150" rx="8" fill="#FFFFFF" stroke="#E8EAED" stroke-width="2"/>
  <rect x="60" y="70" width="80" height="24" rx="4" fill="#E8F0FE"/>
  <rect x="60" y="105" width="60" height="8" rx="4" fill="#E0E0E0"/>
  <rect x="60" y="125" width="70" height="8" rx="4" fill="#E0E0E0"/>
  <rect x="60" y="145" width="50" height="8" rx="4" fill="#E0E0E0"/>

  <!-- Presentation screen on stand (La pantalla que poguem tenir per explicar conceptes) -->
  <rect x="380" y="45" width="120" height="75" rx="6" fill="#202124"/>
  <rect x="385" y="50" width="110" height="65" rx="4" fill="#1E293B"/>
  <!-- Screen content: Google AI Studio UI mock -->
  <rect x="392" y="56" width="30" height="6" rx="2" fill="#4285F4"/>
  <rect x="392" y="66" width="75" height="4" rx="1" fill="#94A3B8"/>
  <rect x="392" y="73" width="60" height="4" rx="1" fill="#94A3B8"/>
  <rect x="392" y="80" width="85" height="4" rx="1" fill="#34A853"/>
  <rect x="392" y="90" width="40" height="12" rx="3" fill="#FBBC04"/>
  <!-- Stand -->
  <path d="M440 120 L440 170 M420 170 L460 170" stroke="#70757A" stroke-width="3" stroke-linecap="round"/>

  <!-- Menorcan Chair (Cadira Menorquina de fusta i lona) & Sofa Lounge setup -->
  <!-- Sofa -->
  <rect x="180" y="180" width="180" height="60" rx="12" fill="#E8EAED"/>
  <rect x="190" y="150" width="160" height="35" rx="10" fill="#DADCE0"/>
  <circle cx="215" cy="170" r="14" fill="#FBBC04" opacity="0.6"/>
  <circle cx="325" cy="170" r="14" fill="#4285F4" opacity="0.6"/>

  <!-- Menorcan Chair (Traditional folding director-style chair iconic in Menorca) -->
  <g transform="translate(70, 175) scale(0.9)">
    <!-- Wooden X frame -->
    <line x1="20" y1="10" x2="60" y2="70" stroke="#A27B5C" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="60" y1="10" x2="20" y2="70" stroke="#8A6546" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Canvas seat (white / ecru canvas) -->
    <path d="M18 36 Q40 44 62 36" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <!-- Backrest -->
    <path d="M20 12 L60 12" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <!-- Small Menorcan crossbar -->
    <line x1="25" y1="65" x2="55" y2="65" stroke="#A27B5C" stroke-width="3"/>
  </g>

  <!-- Puff / Beanbag -->
  <ellipse cx="400" cy="225" rx="35" ry="22" fill="#CEEAD6"/>
  <ellipse cx="400" cy="220" rx="28" ry="16" fill="#34A853" opacity="0.8"/>

  <!-- Low Table / Coffee Table in the middle -->
  <rect x="230" y="220" width="80" height="24" rx="6" fill="#FFFFFF" stroke="#BDC1C6" stroke-width="1.5"/>
  <!-- Laptop on table -->
  <path d="M255 210 L285 210 L288 220 L252 220 Z" fill="#70757A"/>
  <rect x="257" y="196" width="26" height="15" rx="2" fill="#4285F4"/>
  <!-- Coffee cup -->
  <rect x="295" y="210" width="8" height="10" rx="2" fill="#EA4335"/>
  <path d="M303 212 C305 212 306 214 305 217" stroke="#EA4335" stroke-width="1.5" fill="none"/>

  <!-- Floating Sparkles / Clean Google Studio accents -->
  <g transform="translate(245, 120)">
    <circle cx="25" cy="0" r="16" fill="#FFFFFF" filter="drop-shadow(0 4px 10px rgba(66,133,244,0.15))"/>
    <path d="M25 -6 C25 -2 29 0 32 0 C29 0 25 2 25 6 C25 2 21 0 18 0 C21 0 25 -2 25 -6 Z" fill="#4285F4"/>
  </g>
  <g transform="translate(130, 100)">
    <circle cx="15" cy="0" r="12" fill="#FFFFFF" filter="drop-shadow(0 4px 8px rgba(234,67,53,0.15))"/>
    <path d="M15 -4 C15 -1 18 0 20 0 C18 0 15 1 15 4 C15 1 12 0 10 0 C12 0 15 -1 15 -4 Z" fill="#EA4335"/>
  </g>
  <g transform="translate(340, 110)">
    <circle cx="15" cy="0" r="12" fill="#FFFFFF" filter="drop-shadow(0 4px 8px rgba(52,168,83,0.15))"/>
    <path d="M15 -4 C15 -1 18 0 20 0 C18 0 15 1 15 4 C15 1 12 0 10 0 C12 0 15 -1 15 -4 Z" fill="#34A853"/>
  </g>

  <!-- Tag badge in illustration -->
  <rect x="20" y="20" width="160" height="26" rx="13" fill="#E8F0FE"/>
  <text x="32" y="37" font-family="'Google Sans', 'Inter', sans-serif" font-weight="600" font-size="11" fill="#1A73E8">✨ Plaça Bit • 1r Pis Centre Bit</text>
</svg>
